name: Qualifi
description: >-
  Qualifi is a recruiting and hiring platform that streamlines candidate
  screening through asynchronous, voice-based phone interviews, automated
  scheduling, and live video interviews. Recruiters send candidates a
  pre-recorded phone screen, review responses on their own schedule, and move
  qualified applicants forward faster, reducing time-to-hire while keeping the
  candidate experience high. Qualifi offers 50+ applicant tracking system (ATS)
  integrations, a "Qualifi Copilot" that surfaces the tool directly inside your
  ATS, and Google/Microsoft calendar sync. The company is a Techstars portfolio
  company and is SOC 2 Type II certified.
